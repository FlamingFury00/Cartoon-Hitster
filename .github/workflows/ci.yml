name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web app (checks, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (svelte-check)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Deck validation
        run: npm run deck:validate
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build web assets for the app
        run: npm run build:android
      - name: Build release APK
        working-directory: android
        run: |
          # Minutes since 2025-01-01, like the release workflow: newer builds always install over older ones.
          export SIF_VERSION_CODE=$(( ($(date +%s) - 1735689600) / 60 ))
          export SIF_VERSION_NAME="$(grep versionName version.properties | cut -d= -f2)-ci.${{ github.run_number }}"
          ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk SigleInFila.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SigleInFila-apk
          path: SigleInFila.apk
          retention-days: 30
